<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
        maximum-scale=1 / user-scalable=no: prevents iOS from auto-zooming on
        input tap, which would fight with our own pinch-zoom implementation.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extractly - Precision Asset Extraction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================================================================== -->
    <!-- WIZARD HEADER                                                        -->
    <!-- ================================================================== -->

    <div class="wizard-header">
        <div class="brand-container">
            <img src="images/ExtractlyIcon.png" class="logo-icon" alt="Extractly Icon">
            <div class="brand-divider"></div>
            <img src="images/ExtractlyText.png" class="logo-wordmark" alt="Extractly">
            <div id="stepTitle" class="step-indicator">Step 1: Load Image</div>
        </div>
        <div class="nav-btns">
            <button id="btnBack" class="btn-back" disabled>Back</button>
            <button id="btnNext" disabled>Next Step</button>
        </div>
    </div>


    <!-- ================================================================== -->
    <!-- INSTRUCTION BAR & TOOLBARS                                          -->
    <!-- ================================================================== -->

    <!--
        On mobile the instruction bar has two zones:
          .bar-collapsible  — contextual info (instruction text + step swatches).
                              Hidden by default on mobile; toggled by #btnToggleBar.
          #toolbar          — always visible; scrolls horizontally.

        This ensures the toolbar is never hidden or pushed off-screen, while the
        longer instruction text stays accessible but out of the way.
    -->
    <div class="instruction-bar" id="instructionBar">

        <!-- Toggle button — mobile only (hidden on desktop via CSS) -->
        <button id="btnToggleBar" class="btn-toggle-bar" aria-label="Show/hide instructions">
            <span class="toggle-icon">▾</span>
            <span class="toggle-label">Instructions</span>
        </button>

        <!-- Collapsible zone: instruction text + step-specific context rows -->
        <div class="bar-collapsible">

            <div class="instruction-text">
                <span id="instructionSpan">Welcome to Extractly.</span>
                <div id="step2SwatchContainer" class="hidden">
                    <span id="step2Swatch" class="swatch"></span>
                    <button id="btnAcceptColor" class="btn-confirm">Confirm Background</button>
                </div>
            </div>

            <!-- Step 4: protected palette -->
            <div id="paletteDisplay" class="hidden">
                <div class="palette-row">
                    <label style="color: var(--accent-cyan);">Protected:</label>
                    <div id="swatchList"></div>
                    <button id="btnEnableSlider" class="btn-confirm" style="margin-left: auto;">Enable Cleanup Slider</button>
                </div>
            </div>

            <!-- Step 3: target colour swatch -->
            <div id="step3SwatchContainer" class="hidden">
                <label style="color: var(--accent-cyan);">Target Color:</label>
                <span id="step3Swatch" class="swatch"></span>
            </div>

        </div><!-- /.bar-collapsible -->

        <!-- Always-visible toolbar — scrolls horizontally -->
        <div id="toolbar" class="toolbar-row">

            <!-- Step 1 -->
            <div id="loadBox" class="tool-group">
                <label>Source</label>
                <button onclick="document.getElementById('fileInput').click()">Load Image</button>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </div>

            <!-- Steps 2–6 -->
            <div id="zoomBox" class="tool-group hidden">
                <label>Zoom (<span id="zoomVal">1.0</span>x)</label>
                <input type="range" id="zoomRange" min="0.1" max="10" step="0.05" value="1">
            </div>

            <div id="tintBox" class="tool-group hidden">
                <label>Workspace Tint</label>
                <input type="range" id="bgTint" min="0" max="255" value="34">
            </div>

            <!-- Step 4 -->
            <div id="colorPickerBox" class="tool-group hidden">
                <label id="colorLabel">Highlight Color</label>
                <input type="color" id="targetColor" value="#000000">
            </div>

            <!-- Steps 3–4 -->
            <div id="tolBox" class="tool-group hidden">
                <label>Tolerance (<span id="tolVal">0</span>)</label>
                <input type="range" id="tolerance" min="0" max="1" step="0.001" value="0">
            </div>

            <!-- Step 3 -->
            <div id="floodBox" class="tool-group hidden">
                <label>Mode</label>
                <div class="flood-toggle-row">
                    <input type="checkbox" id="floodFillToggle">
                    <span>Contiguous</span>
                </div>
            </div>

            <!-- Step 6: crop / export -->
            <div id="cropTools" class="toolbar-row hidden">
                <div class="tool-group">
                    <label>Template</label>
                    <select id="cropTemplate">
                        <option value="custom">Free Draw</option>
                        <option value="1:1">Square (1:1)</option>
                        <option value="4:3">Standard (4:3)</option>
                        <option value="16:9">Wide (16:9)</option>
                        <option value="bespoke">Bespoke</option>
                    </select>
                </div>
                <div class="tool-group">
                    <label>Aspect</label>
                    <div class="input-pair">
                        <input type="number" id="targetW" placeholder="W" value="0">
                        <span>×</span>
                        <input type="number" id="targetH" placeholder="H" value="0">
                    </div>
                </div>
                <div class="tool-group">
                    <label>Size (px)</label>
                    <div class="input-pair">
                        <input type="number" id="cropW" placeholder="W" value="0">
                        <span>×</span>
                        <input type="number" id="cropH" placeholder="H" value="0">
                    </div>
                </div>
                <div class="tool-group">
                    <label>&nbsp;</label>
                    <button id="btnDownload" class="btn-download">↓ Download</button>
                </div>
            </div>

            <!-- Steps 2–5 -->
            <div id="undoBoxTool" class="tool-group hidden">
                <label>History</label>
                <button id="btnLocalUndo" class="btn-undo">↩ Undo</button>
            </div>

        </div><!-- /#toolbar -->

    </div><!-- /.instruction-bar -->


    <!-- ================================================================== -->
    <!-- CANVAS VIEWPORT                                                      -->
    <!-- ================================================================== -->

    <!--
        .viewport is a plain overflow: auto scroll container.
        .viewport-content is an inner flex+padding div — separating layout from
        scrolling fixes the browser bug where flex+overflow clips end padding.
    -->
    <div class="viewport" id="viewport">
        <div class="viewport-content">
            <div id="wrapper" class="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
                <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
            </div>
        </div>

        <!--
            Floating controls — overlaid on the canvas.
            Zoom +/- work on all devices.
            Pan mode toggle replaces the right-click pan gesture on touch devices
            so users don't need to juggle two-finger gestures while drawing.
        -->
        <div id="floatingControls" class="floating-controls hidden">
            <button id="btnPanToggle" class="float-btn float-pan" title="Toggle pan mode — tap to move the image with one finger">
                ✥
            </button>
            <div class="float-divider"></div>
            <button id="btnZoomIn"  class="float-btn" title="Zoom in">+</button>
            <button id="btnZoomOut" class="float-btn" title="Zoom out">−</button>
        </div>

    </div><!-- /.viewport -->


    <script src="script.js"></script>
</body>
</html>
